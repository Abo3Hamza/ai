<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لعبة بطاقات الذاكرة</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 1000px;
        width: 100%;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        color: #333;
        margin-bottom: 20px;
        font-size: 2.5em;
      }

      .stats {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      .stat-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px 30px;
        border-radius: 10px;
        text-align: center;
        min-width: 150px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .stat-box label {
        display: block;
        font-size: 0.9em;
        margin-bottom: 8px;
        opacity: 0.9;
      }

      .stat-box .value {
        font-size: 2em;
        font-weight: bold;
      }

      .controls {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 30px;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 30px;
        font-size: 1em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.3s ease;
      }

      .btn-start {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-start:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-reset {
        background: #ff6b6b;
        color: white;
      }

      .btn-reset:hover {
        background: #ff5252;
        transform: translateY(-2px);
      }

      .game-board {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
      }

      .card {
        aspect-ratio: 1;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 2.5em;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        color: white;
        font-weight: bold;
      }

      .card:hover:not(.matched):not(.flipped) {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      .card.flipped {
        background: white;
        color: #333;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .card.matched {
        background: #51cf66;
        cursor: default;
        box-shadow: 0 5px 15px rgba(81, 207, 102, 0.4);
      }

      .card.matched:hover {
        transform: none;
      }

      .card.wrong {
        animation: shake 0.5s;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
      }

      .message {
        text-align: center;
        font-size: 1.2em;
        margin-top: 20px;
        min-height: 30px;
      }

      .message.success {
        color: #51cf66;
        font-weight: bold;
      }

      .message.error {
        color: #ff6b6b;
        font-weight: bold;
      }

      .difficulty {
        text-align: center;
        margin-bottom: 20px;
      }

      .difficulty label {
        margin-right: 20px;
        font-weight: bold;
        color: #333;
      }

      .difficulty select {
        padding: 8px 15px;
        border-radius: 5px;
        border: 2px solid #667eea;
        font-size: 1em;
        cursor: pointer;
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }

        .header h1 {
          font-size: 1.8em;
        }

        .game-board {
          grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
          gap: 8px;
        }

        .card {
          font-size: 1.8em;
        }

        .stat-box {
          min-width: 120px;
          padding: 15px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎮 لعبة بطاقات الذاكرة</h1>
      </div>

      <div class="stats">
        <div class="stat-box">
          <label>⏱️ الوقت المستغرق</label>
          <div class="value" id="timer">0:00</div>
        </div>
        <div class="stat-box">
          <label>❌ الحركات الخاطئة</label>
          <div class="value" id="wrongMoves">0</div>
        </div>
        <div class="stat-box">
          <label>✅ الأزواج المطابقة</label>
          <div class="value" id="matches">0</div>
        </div>
      </div>

      <div class="difficulty">
        <label for="difficultySelect">مستوى الصعوبة:</label>
        <select id="difficultySelect">
          <option value="easy">سهل (26 بطاقة)</option>
          <option value="medium" selected>متوسط (50 بطاقة)</option>
          <option value="hard">صعب (60 بطاقة)</option>
        </select>
      </div>

      <div class="controls">
        <button class="btn-start" id="startBtn">🎮 ابدأ اللعبة</button>
        <button class="btn-reset" id="resetBtn">🔄 إعادة تعيين</button>
      </div>

      <div class="game-board" id="gameBoard"></div>

      <div class="message" id="message"></div>
    </div>

    <script>
      const gameBoard = document.getElementById('gameBoard');
      const timerDisplay = document.getElementById('timer');
      const wrongMovesDisplay = document.getElementById('wrongMoves');
      const matchesDisplay = document.getElementById('matches');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const messageDisplay = document.getElementById('message');
      const difficultySelect = document.getElementById('difficultySelect');

      let cards = [];
      let flipped = [];
      let matched = [];
      let wrongMoves = 0;
      let matches = 0;
      let gameStarted = false;
      let gameActive = true;
      let timerInterval = null;
      let seconds = 0;

      // الرموز والكلمات المختلفة
      const symbols = [
        '🍎', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍒', '🍑', '🥝',
        '🍍', '🥭', '🍅', '🥑', '🥦', '🥬', '🌽', '🥒', '🌶️', '🥔',
        '🍞', '🥐', '🥯', '🍞', '🥖', '🥨', '🧀', '🍗', '🍖', '🌭',
        '🍔', '🍟', '🍕', '🌮', '🌯', '🥙', '🧆', '🍝', '🍜', '🍲',
        '🥘', '🍛', '🍣', '🍱', '🥟', '🦪', '🍤', '🍙', '🍚', '🍖',
        '🎂', '🍰', '🧁', '🍪', '🍩', '🍫', '🍬', '🍭', '🍮', '🍯'
      ];

      function initializeGame() {
        const difficulty = difficultySelect.value;
        let cardCount;

        if (difficulty === 'easy') {
          cardCount = 26;
        } else if (difficulty === 'medium') {
          cardCount = 50;
        } else {
          cardCount = 60;
        }

        // تأكد من أن العدد زوجي
        if (cardCount % 2 !== 0) cardCount++;

        // إنشاء أزواج من الرموز
        const gameSymbols = [];
        for (let i = 0; i < cardCount / 2; i++) {
          const symbol = symbols[i % symbols.length];
          gameSymbols.push(symbol, symbol);
        }

        // خلط العناصر
        cards = gameSymbols.sort(() => Math.random() - 0.5);
        flipped = [];
        matched = [];
        wrongMoves = 0;
        matches = 0;
        gameActive = true;
        seconds = 0;

        updateDisplay();
        renderBoard();
      }

      function renderBoard() {
        gameBoard.innerHTML = '';
        cards.forEach((symbol, index) => {
          const card = document.createElement('button');
          card.className = 'card';
          card.dataset.index = index;

          if (matched.includes(index)) {
            card.classList.add('matched');
            card.textContent = symbol;
          } else if (flipped.includes(index)) {
            card.classList.add('flipped');
            card.textContent = symbol;
          } else {
            card.textContent = '?';
          }

          card.addEventListener('click', () => flipCard(index));
          gameBoard.appendChild(card);
        });
      }

      function flipCard(index) {
        if (!gameStarted) {
          startGame();
        }

        if (!gameActive || flipped.includes(index) || matched.includes(index) || flipped.length >= 2) {
          return;
        }

        flipped.push(index);
        renderBoard();

        if (flipped.length === 2) {
          gameActive = false;
          setTimeout(checkMatch, 600);
        }
      }

      function checkMatch() {
        const [first, second] = flipped;
        const isMatch = cards[first] === cards[second];

        if (isMatch) {
          matched.push(first, second);
          matches++;
          messageDisplay.textContent = '✅ تطابق صحيح!';
          messageDisplay.className = 'message success';
        } else {
          wrongMoves++;
          messageDisplay.textContent = '❌ لا يوجد تطابق، حاول مرة أخرى!';
          messageDisplay.className = 'message error';
        }

        flipped = [];
        gameActive = true;
        updateDisplay();
        renderBoard();

        // تحقق من الفوز
        if (matched.length === cards.length) {
          endGame();
        }
      }

      function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        startBtn.disabled = true;
        difficultySelect.disabled = true;

        timerInterval = setInterval(() => {
          seconds++;
          updateTimer();
        }, 1000);
      }

      function endGame() {
        gameStarted = false;
        gameActive = false;
        clearInterval(timerInterval);
        startBtn.disabled = false;
        difficultySelect.disabled = false;

        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        messageDisplay.textContent = `🎉 مبروك! أكملت اللعبة في ${minutes}:${secs.toString().padStart(2, '0')} وعدد الأخطاء: ${wrongMoves}`;
        messageDisplay.className = 'message success';
      }

      function updateTimer() {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        timerDisplay.textContent = `${minutes}:${secs.toString().padStart(2, '0')}`;
      }

      function updateDisplay() {
        wrongMovesDisplay.textContent = wrongMoves;
        matchesDisplay.textContent = matches;
      }

      startBtn.addEventListener('click', () => {
        initializeGame();
      });

      resetBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        gameStarted = false;
        messageDisplay.textContent = '';
        startBtn.disabled = false;
        difficultySelect.disabled = false;
        initializeGame();
      });

      // تهيئة اللعبة عند التحميل
      initializeGame();
    </script>
  </body>
</html>
